      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: ${SPRING_DATA_MONGODB_DATABASE:menu_db}

server:
  port: 8080

logging:
  level:
    root: INFO
    com.neurogine.menu: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO